            <p>Run through scenarios: </p>
            <div class="scenarioOptions">
                <!--Maybe use JS to dynamically add buttons horizontally for scenario options-->
                <button>Restaurant Day</button>
                <button>The Thunderstorm</button>

            <h3 id="currentLine">After a long day at work, you want to pick some food up instead of cooking at home.</h3>
            <div class="choices">
                <!--Maybe use JS to dynamically add buttons to make choices to influence the next line of the story-->
                <button id="option1">Pick the cheaper fast-food place to grab a quick meal to go. No utensils provided. You have to do your own dishes.</button>
                <button id="option2">Pick the equally delicious but more nutritious expensive restaurant to dine in. You don't have to do anything but eat and pay.</button>
            </div>
            <p id="storyResult"> <!--Change text acccording to user choice--></p>
            <p id="brainExplain"> <!--Change text acccording to user choice. Brain explanation of storyResult--></p>
            <button id="next"> Next<!--Updates currentLine and choices. Clears storyResult and BrainExplain--></button>
        </div>
